<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xyron Notes - Super Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2979FF">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <img src="icon.png" alt="Logo" style="width: 28px; height: 28px; border-radius: 6px; margin-right: 10px;">
            Xyron <span class="blue">Notes</span>
            <span class="nav-tag">SUPER ADMIN</span>
        </div>
        <div class="nav-brand-mobile" style="display: none;">
            <img src="icon.png" alt="Logo" style="width: 24px; height: 24px; border-radius: 6px;">
            <span>Xyron Notes</span>
        </div>
        <div class="nav-right">
            <button class="btn-logout" onclick="window.location.href='home.html'" style="color: var(--blue); border-color: transparent;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>View Portal</span>
            </button>
            <div class="nav-user" style="margin-left: 10px;">
                <div class="avatar-circle" id="superAdminProfileAvatar">S</div>
                <span>Super Admin</span>
            </div>
            <button type="button" class="btn-logout" id="editProfileBtn" style="color: var(--blue); border-color: transparent;">
                <span>Edit Profile</span>
            </button>
            <button class="btn-logout" id="logoutBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Logout</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-icon orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                <div class="stat-num" id="statPendingAdmins">0</div>
                <div class="stat-label">Admin Requests</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                <div class="stat-num" id="statAdmins">0</div>
                <div class="stat-label">Admins</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
                <div class="stat-num" id="statStudents">0</div>
                <div class="stat-label">Students</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                <div class="stat-num" id="statMaterials">0</div>
                <div class="stat-label">Materials</div>
            </div>
        </div>

        <div class="tabs super-tabs">
            <button class="tab-btn active" data-tab="adminRequests">Admin Requests</button>
            <button class="tab-btn" data-tab="admins">Admins</button>
            <button class="tab-btn" data-tab="students">Students</button>
            <button class="tab-btn" data-tab="materials">Materials</button>
        </div>

        <section class="tab-panel active" id="adminRequestsTab">
            <div class="section-card">
                <h2>Admin Approval Requests</h2>
                <div id="pendingAdminsList"></div>
                <div id="pendingAdminsEmpty" class="empty-state" style="display:none;"><h3>No admin requests</h3></div>
            </div>
        </section>

        <section class="tab-panel" id="adminsTab">
            <div class="section-card">
                <h2>Approved Admins</h2>
                <div id="adminsList"></div>
                <div id="adminsEmpty" class="empty-state" style="display:none;"><h3>No approved admins yet</h3></div>
            </div>
        </section>

        <section class="tab-panel" id="studentsTab">
            <div class="section-card">
                <h2>Students</h2>
                <div id="pendingStudentsList"></div>
                <div id="studentsList"></div>
                <div id="studentsEmpty" class="empty-state" style="display:none;"><h3>No students yet</h3></div>
            </div>
        </section>

        <section class="tab-panel" id="materialsTab">
            <div class="welcome-card" style="box-shadow: none;">
                <h2>Manage Materials</h2>
                <div class="upload-area modern-upload-area" id="uploadArea" onclick="toggleUploadForm()">
                    <svg viewBox="0 0 24 24" style="width: 40px; height: 40px; margin-bottom: 10px;" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <h3>Click to Upload New Material</h3>
                </div>
                <div class="upload-form modern-upload-form" id="uploadForm" style="display:none;">
                    <form id="addMaterialForm" class="material-upload-form">
                        <div class="form-grid">
                            <div class="field"><label for="matTitle">Document Title</label><input type="text" id="matTitle" required class="input-box"></div>
                            <div class="field"><label for="matSubject">Subject Name</label><input type="text" id="matSubject" required class="input-box"></div>
                            <div class="field"><label for="matCategory">Category</label><select id="matCategory" required class="input-box"><option value="Notes">Notes (PDF, Docs)</option><option value="Video">Video Lectures (Link/File)</option><option value="Quiz">Quizzes / Assignments</option></select></div>
                            <div class="field" id="videoSourceGroup" style="display: none;"><label for="matVideoSource">Video Source</label><select id="matVideoSource" class="input-box"><option value="link">Online Link</option><option value="file">Offline Video File</option></select></div>
                        </div>
                        <div class="field" id="fileFieldGroup"><label for="matFile" id="matFileLabel">Select File</label><input type="file" id="matFile" required class="input-box file-input"></div>
                        <div class="field" id="linkFieldGroup" style="display: none;"><label for="matLink">Video Link (URL)</label><input type="url" id="matLink" class="input-box"></div>
                        <div id="quizFieldGroup" class="quiz-builder" style="display: none;"><div class="quiz-builder-head"><label>Quiz Questions</label><button type="button" class="btn btn-secondary btn-inline" onclick="addQuizQuestion()">+ Add Question</button></div><div id="questionsContainer" class="questions-container"></div></div>
                        <div class="form-actions"><button type="submit" class="btn btn-primary" id="uploadBtn">Upload</button><button type="button" class="btn btn-ghost" onclick="toggleUploadForm()">Cancel</button></div>
                    </form>
                </div>
                <div id="materialsAdminList" style="margin-top:14px;"></div>
            </div>
        </section>
    </main>
    <div id="editProfileModal" class="popup-overlay" style="display:none;">
        <div class="mat-modal-card">
            <button class="mat-modal-close" id="closeEditProfileModal" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="mat-modal-head">
                <h2>Edit Profile</h2>
            </div>
            <form id="editProfileForm" class="edit-profile-form">
                <div class="profile-form-grid">
                    <div class="field"><label for="profileName">Name</label><input type="text" id="profileName" class="input-box" required></div>
                    <div class="field"><label for="profileInstituteName">Institution</label><input type="text" id="profileInstituteName" class="input-box" required></div>
                    <div class="field"><label for="profileBranch">Department / Branch</label><input type="text" id="profileBranch" class="input-box"></div>
                    <div class="field"><label for="profileSemester">Semester</label><input type="text" id="profileSemester" class="input-box"></div>
                    <div class="field profile-image-field"><label for="profileImageFile">Profile Image</label><input type="file" id="profileImageFile" accept="image/*" class="input-box file-input"></div>
                </div>
                <div class="mat-modal-btns">
                    <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save</button>
                    <button type="button" class="btn btn-ghost" id="cancelEditProfileBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <div id="toastBox" class="toast-box"></div>
    <script src="js/data.js"></script>
    <script src="js/superadmin.js"></script>
</body>
</html>
